---

- hosts : all
  become: true
  tasks:

  - name: Update repository index
    apt:
      update_cache: yes
    when: ansible_distribution in ["Ubuntu", "Debian"]

  - name: uninstall apache2 package
    apt:
      name: apache2
      state: absent   
    tags: 
      - Ubuntu
 
  - name: add php for apache
    apt:
      name: libapache2-mod-php
      state: latest
    when: ansible_distribution in ["Debian", "Ubuntu"] 
 